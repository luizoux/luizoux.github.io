title = "Luiza Marinho"
author = "Luiza Marinho"
languageCode = "pt-br"
defaultContentLanguage = "pt-br"
theme = "digio-theme"
enableInlineShortcodes = true
ignoreFiles = ["(open-source/(test3|test4)|write/(test|test2))\\.md$"]

[menus]
  [[menus.main]]
    name = "home"
    pageRef = "/"
    weight = 1

  [[menus.main]]
    name = "codes"
    pageRef = "/open-source"
    weight = 2

  [[menus.main]]
    name = "write"
    pageRef = "/write"
    weight = 3

  [[menus.main]]
    name = "me"
    pageRef = "/me"
    weight = 4

[markup.goldmark.renderer]
  unsafe = true
