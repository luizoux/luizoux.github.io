baseURL = "https://www.luiza.dev/"
title = "Luiza Marinho"
author = "Luiza Marinho"
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false
enableInlineShortcodes = true
ignoreFiles = ["(open-source/(test3|test4)|write/(test|test2))\\.md$"]

[languages]
  [languages.pt-br]
    languageCode = "pt-BR"
    languageName = "Português (Brasil)"
    weight = 1

    [[languages.pt-br.menus.main]]
    identifier = "home"
    name = "início"
    pageRef = "/"
    weight = 1

    [[languages.pt-br.menus.main]]
    identifier = "projects"
    name = "projetos"
    pageRef = "/open-source"
    weight = 2

    [[languages.pt-br.menus.main]]
    identifier = "writing"
    name = "escritos"
    pageRef = "/write"
    weight = 3

    [[languages.pt-br.menus.main]]
    identifier = "about"
    name = "sobre"
    pageRef = "/me"
    weight = 4

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2

    [[languages.en.menus.main]]
    identifier = "home"
    name = "home"
    pageRef = "/"
    weight = 1

    [[languages.en.menus.main]]
    identifier = "projects"
    name = "projects"
    pageRef = "/open-source"
    weight = 2

    [[languages.en.menus.main]]
    identifier = "writing"
    name = "writing"
    pageRef = "/write"
    weight = 3

    [[languages.en.menus.main]]
    identifier = "about"
    name = "about"
    pageRef = "/me"
    weight = 4

[markup.goldmark.renderer]
  unsafe = true
